# autotrade configuration
#
# Copy to autotrade.toml and edit. Everything here is enforced by autotrade/guards.py,
# and every limit fails closed: omit one and you get the conservative default, not
# "unlimited". Unknown keys raise rather than being ignored, so a typo in a cap
# cannot silently disable it.
#
# Validate with:  python -m autotrade check

[account]
# The "Agentic" cash account (****4944) — the only one this agent can reach.
# The margin and Roth accounts are agentic_allowed=false and cannot be used here.
number = "771654944"

# "paper" simulates fills and can never place a real order.
# "live" emits intents for the agent to review with you; it still cannot place
# anything on its own.
mode = "paper"   # flip to "live" only when you mean it


[limits]
# Deliberately tight. Raising these is a one-line edit you make on purpose,
# after watching the system behave. autotrade/config.py refuses values above
# its own ceilings ($5,000/order, $10,000/day, 20 orders/day) regardless.
# Sized to real buying power, not aspiration. The account held $30 when this
# was written; a $15 + $10 weekly pair fits, a $25 + $25 pair does not.
max_notional_per_order = 15.0
max_notional_per_day = 25.0
max_orders_per_day = 2

# At $25/week this allows roughly four years of accumulation before it blocks.
# It WILL eventually block — that is intended, so the position cannot grow
# unbounded without you revisiting it. `python -m autotrade status` shows the
# headroom remaining.
max_position_notional_per_symbol = 5000.0

# No new positions once realised losses reach this for the day.
daily_loss_limit = 200.0

# Nothing outside this list can be bought, whatever the rules say.
allowlist = ["VTI", "VXUS"]

# $25 buys 0.065 shares of a $380 ETF, so this must be true — the broker only
# permits fractional shares on type=market with a dollar_amount. That gives up
# price protection, which is why max_spread_bps below exists to compensate.
allow_fractional = true

# Only applies to market orders. A liquid ETF trades at 1-3 bps during regular
# hours; anything near 25 means a thin or stale book, and an uncapped market
# order into that is how you get a bad fill.
max_spread_bps = 25.0

# Refuse to act on a quote older than this.
max_quote_age_seconds = 300

# Applies to whole-share limit orders only (unused while every order is
# fractional, but it takes effect the moment an order affords a full share).
limit_offset_bps = 10.0

# Must stay true in live mode unless auto_execute below is deliberately set.
require_confirmation = true

# Unattended live placement. OFF here on purpose — the shipped example must not
# be a config that spends money unwatched. Turning it on means orders place with
# no human looking at them; every machine guard still applies (allowlist, caps,
# spread, staleness, duplicate, kill switch), but the human gate is gone, and a
# bug or bad quote moves money before anyone can catch it.
#
# Turning it on requires setting require_confirmation = false AND auto_execute =
# true together. Config loading rejects one without the other, so the gate can
# never come off by omission. A separate $500/day ceiling applies in this mode
# regardless of max_notional_per_day.
auto_execute = false


# --- Rules -------------------------------------------------------------------
# Only buys. Selling is deliberately not automated — exits deserve a human.
# See `python -m autotrade rules` for every available condition.

[[rules]]
id = "vti-weekly"
symbol = "VTI"
condition = "weekly_schedule"
weekday = "monday"
amount_usd = 15.0
# 6 days keeps this to once per week even if `plan` runs every day.
cooldown_days = 6
note = """Total US market DCA. Needs no forecasting skill to be sound: it does \
not depend on any single company surviving, because the index replaces \
failures automatically."""


# Supplements the weekly buy — it does not replace it. Waiting for lows means
# not buying at all for long stretches, and time out of a rising market has
# historically cost more than the discount earned by waiting. This adds a
# second $25 on genuinely weak days and is silent otherwise.
#
# Reality check: on 2026-08-07 VTI was $381.74, some 6.6% ABOVE its 60-day low
# of $358.04, so this rule fires nothing today. That is the normal state.
# International ex-US. VTI holds zero of it, and roughly 40% of world market
# cap sits outside the United States, so this is the single largest gap in a
# VTI-only portfolio. The 15/10 split is close to global market-cap weight.
[[rules]]
id = "vxus-weekly"
symbol = "VXUS"
condition = "weekly_schedule"
weekday = "monday"
amount_usd = 10.0
cooldown_days = 6
note = "International developed + emerging markets."


# DISABLED while buying power is $30. Re-enable once the account is funded
# enough to absorb an extra buy without starving the weekly ones — otherwise a
# dip day consumes the cash the scheduled buys need.
[[rules]]
id = "vti-dip"
symbol = "VTI"
condition = "near_period_low"
threshold = 2.0        # within 2% of the low
lookback_days = 60
amount_usd = 15.0
cooldown_days = 5
enabled = false
note = "Extra buy when price is near a 60-day low."
